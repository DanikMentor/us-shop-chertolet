<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена | 404</title>
    <style>
        
        body {
            background-color: #161625; 
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 10rem; 
            margin: 0;
            font-weight: 900;
            letter-spacing: 20px;
            background: linear-gradient(90deg, #955DFF, #FF84D2); 
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.3; 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            color: #b0b0b0;
            margin-bottom: 30px;
        }

        .btn {
            text-decoration: none;
            background: #fff;
            color: #161625;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.4);
            background: #f0f0f0;
        }

        .ghost {
            width: 100px;
            height: 120px;
            background: #fff;
            border-radius: 50px 50px 0 0;
            position: relative;
            margin: 0 auto 40px auto;
            animation: float 3s ease-in-out infinite; 
        }

        .ghost::before {
            content: '';
            position: absolute;
            top: 40px;
            left: 25px;
            width: 12px;
            height: 12px;
            background: #161625;
            border-radius: 50%;
            box-shadow: 40px 0 0 #161625; 
        }

        .ghost::after {
            content: '';
            position: absolute;
            top: 65px;
            left: 42px;
            width: 16px;
            height: 16px;
            background: #161625;
            border-radius: 50%;
        }

        .ghost-bottom {
            position: absolute;
            bottom: -10px;
            width: 100%;
            height: 20px;
            background-size: 20px 20px;
            background-image: radial-gradient(circle at 10px -5px, transparent 12px, #fff 13px);
        }
        
        .shadow {
            width: 80px;
            height: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            margin: -20px auto 0 auto;
            animation: shadow-scale 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes shadow-scale {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(0.8); opacity: 0.1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        
        <div class="ghost">
            <div class="ghost-bottom"></div>
        </div>
        <div class="shadow"></div>

        <h2><br><br><br><br><br>Упс! Страница исчезла.</h2>
        <p>Похоже, мы не можем найти то, что вы искали.<br>Возможно, привидение утащило эту страницу.</p>
        
        <a href="/" class="btn">ВЕРНУТЬСЯ НА ГЛАВНУЮ</a>
    </div>

</body>
</html>
